<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel to CSV Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 12px;
        }

        input[type="file"] {
            margin: 16px 0;
            width: 100%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .note {
            font-size: 12px;
            color: #555;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Excel → CSV</h2>

    <input type="file" id="fileInput" accept=".xlsx,.xls">

    <button id="convertBtn">Convert & Download CSV</button>

    <div class="note">
        Files are processed locally in your browser.<br>
        Nothing is uploaded.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
document.getElementById('convertBtn').addEventListener('click', () => {
    const input = document.getElementById('fileInput');

    if (!input.files.length) {
        alert('Select an Excel file first');
        return;
    }

    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        // First sheet only (simple + predictable)
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        const csv = XLSX.utils.sheet_to_csv(sheet);

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.(xlsx|xls)$/i, '.csv');
        a.click();

        URL.revokeObjectURL(url);
    };

    reader.readAsArrayBuffer(file);
});
</script>

</body>
</html>
